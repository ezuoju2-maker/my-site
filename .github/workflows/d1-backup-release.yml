name: D1 Encrypted Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: d1-backup-release
  cancel-in-progress: false

jobs:
  backup:
    name: Export, encrypt and publish D1 backup
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      DB_NAME: my-site-db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BACKUP_ENCRYPTION_KEY"

          if ! [[ "$BACKUP_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "BACKUP_ENCRYPTION_KEY must be exactly 64 hexadecimal characters."
            exit 1
          fi

      - name: Export remote D1
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p backup-work

          npx wrangler d1 export "$DB_NAME" \
            --remote \
            --output=backup-work/my-site.sql \
            --skip-confirmation

          test -s backup-work/my-site.sql

          echo "D1 export completed."
          wc -c backup-work/my-site.sql

      - name: Create backup manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > backup-work/manifest.json <<EOF_MANIFEST
          {
            "format": "my-site-d1-backup-v1",
            "database": "$DB_NAME",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}"
          }
          EOF_MANIFEST

      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail

          tar -C backup-work \
            -czf backup-work/my-site-d1-backup.tar.gz \
            my-site.sql \
            manifest.json

          sha256sum backup-work/my-site-d1-backup.tar.gz \
            > backup-work/my-site-d1-backup.tar.gz.sha256

      - name: Encrypt backup
        shell: bash
        run: |
          set -euo pipefail

          node scripts/encrypt-backup.mjs \
            backup-work/my-site-d1-backup.tar.gz \
            backup-work/my-site-d1-backup.tar.gz.enc

          sha256sum backup-work/my-site-d1-backup.tar.gz.enc \
            > backup-work/my-site-d1-backup.tar.gz.enc.sha256

          rm -f backup-work/my-site.sql
          rm -f backup-work/my-site-d1-backup.tar.gz
          rm -f backup-work/my-site-d1-backup.tar.gz.sha256

          echo "Encrypted backup prepared:"
          ls -lh backup-work/

      - name: Create GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="d1-backup-$(date -u +%Y%m%d-%H%M%S)"

          RELEASE_JSON="$(
            curl -fsSL \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              -d "$(jq -n \
                --arg tag "$TAG" \
                --arg target "$GITHUB_SHA" \
                '{
                  tag_name: $tag,
                  target_commitish: $target,
                  name: $tag,
                  body: "Automated encrypted D1 disaster-recovery backup.",
                  draft: false,
                  prerelease: true,
                  make_latest: "false",
                  generate_release_notes: false
                }')"
          )"

          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          UPLOAD_URL="$(jq -r '.upload_url' <<<"$RELEASE_JSON" | sed 's/{?name,label}$//')"

          test "$RELEASE_ID" != "null"
          test "$UPLOAD_URL" != "null"

          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ steps.release.outputs.UPLOAD_URL }}
        run: |
          set -euo pipefail

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/octet-stream" \
            "${UPLOAD_URL}?name=my-site-d1-backup.tar.gz.enc" \
            --data-binary "@backup-work/my-site-d1-backup.tar.gz.enc" \
            > release-asset.json

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: text/plain" \
            "${UPLOAD_URL}?name=my-site-d1-backup.tar.gz.enc.sha256" \
            --data-binary "@backup-work/my-site-d1-backup.tar.gz.enc.sha256" \
            > release-checksum.json

          echo "Encrypted backup uploaded successfully."

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf backup-work
          rm -f release-asset.json release-checksum.json
