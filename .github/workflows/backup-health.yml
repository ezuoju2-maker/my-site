name: Backup Health Check

# 每日检查最近的 d1-backup-* release 年龄。
# 若超过 48 小时未成功备份，自动开 GitHub Issue 告警。
#
# 为什么用 Issue 而不是邮件：
# - 0 额外密钥（不需要 RESEND_API_KEY）
# - 0 额外服务（GitHub 自带）
# - GitHub Issue 创建会触发 watch 邮件通知

on:
  schedule:
    # 每天 UTC 6 点（备份 workflow 是 UTC 3 点，留 3 小时余量）
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      THRESHOLD_HOURS: "48"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Find latest d1-backup release age
        id: check
        shell: bash
        run: |
          set -euo pipefail

          echo "=== 查询最新 d1-backup-* release ==="

          LATEST=$(gh api "repos/${REPO}/releases" --paginate \
            --jq '[.[] | select(.tag_name | startswith("d1-backup-"))][0].published_at // empty' \
            2>/dev/null || echo "")

          if [ -z "$LATEST" ]; then
            echo "没有任何 d1-backup-* release"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=no-backup-ever" >> "$GITHUB_OUTPUT"
            echo "hours=0" >> "$GITHUB_OUTPUT"
            echo "latest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "最新备份发布时间: $LATEST"

          NOW_TS=$(date -u +%s)
          BACKUP_TS=$(date -u -d "$LATEST" +%s 2>/dev/null || echo "0")
          HOURS=$(( (NOW_TS - BACKUP_TS) / 3600 ))

          echo "距今: ${HOURS} 小时"

          if [ "$HOURS" -gt "$THRESHOLD_HOURS" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=too-old" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "reason=fresh" >> "$GITHUB_OUTPUT"
          fi
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "=== 检查结果 ==="
          echo "stale: ${{ steps.check.outputs.stale }}"
          echo "reason: ${{ steps.check.outputs.reason }}"
          echo "hours: ${{ steps.check.outputs.hours }}"
          echo "latest: ${{ steps.check.outputs.latest }}"

      - name: Close stale alert if backup recovered
        if: steps.check.outputs.stale == 'false'
        shell: bash
        run: |
          set -euo pipefail
          OPEN_ISSUES=$(gh issue list --repo "$REPO" \
            --label backup-health \
            --state open \
            --json number \
            --jq '.[].number')

          for num in $OPEN_ISSUES; do
            echo "关闭已恢复的告警 issue #$num"
            gh issue close "$num" --repo "$REPO" \
              --comment "备份已恢复（最新：${{ steps.check.outputs.latest }}）。自动关闭。"
          done

      - name: Open alert issue if stale
        if: steps.check.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail

          gh label create backup-health \
            --repo "$REPO" \
            --color FBCA04 \
            --description "Automated backup health alerts" \
            2>/dev/null || true

          EXISTING=$(gh issue list --repo "$REPO" \
            --label backup-health \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "已有 open 的 backup-health issue，跳过"
            exit 0
          fi

          REASON="${{ steps.check.outputs.reason }}"
          HOURS="${{ steps.check.outputs.hours }}"
          LATEST="${{ steps.check.outputs.latest }}"

          if [ "$REASON" = "no-backup-ever" ]; then
            BODY="## 从未生成过 D1 备份

此仓库还没有任何 d1-backup-* release。

**可能原因**：
- d1-backup-release.yml workflow 从未成功运行
- 相关 secrets 未配置（CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID、BACKUP_ENCRYPTION_KEY）

**排查步骤**：
1. 打开 https://github.com/${REPO}/actions/workflows/d1-backup-release.yml
2. 查看是否有失败记录，检查 failure 日志
3. 手动触发一次：Actions -> D1 Encrypted Backup -> Run workflow
"
          else
            BODY="## D1 备份已超过 ${HOURS} 小时未更新

**最新备份**：\`$LATEST\`
**距今**：${HOURS} 小时（阈值：${THRESHOLD_HOURS} 小时）

**可能原因**：
- d1-backup-release.yml 的 schedule 失效（GitHub 对 schedule 是 best-effort）
- 最近一次 workflow 运行失败
- secrets 过期或被删除

**应急操作**：
1. 打开 https://github.com/${REPO}/actions/workflows/d1-backup-release.yml
2. 点 Run workflow 手动触发一次
3. 成功后本 issue 会自动关闭

**长期修复**：
- 定期检查 Actions 页面
- 或考虑用外部 cron 通过 API 触发
"
          fi

          gh issue create --repo "$REPO" \
            --title "[Backup Alert] D1 backup is stale (${HOURS}h)" \
            --label backup-health \
            --body "$BODY"

          echo "已创建告警 issue"
