name: Backup Health Check

# Daily check of the latest d1-backup-* release age.
# If stale > 48h, opens a GitHub issue (which triggers email notification).
#
# Design:
# - Uses GitHub Issue instead of email (no extra secrets required)
# - Auto-closes the issue once backup recovers
# - Idempotent: skips if an open issue with label backup-health exists

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      THRESHOLD_HOURS: "48"

    steps:
      - name: Find latest backup age
        id: check
        shell: bash
        run: |
          set -euo pipefail

          latest=$(gh api "repos/${REPO}/releases" --paginate \
            --jq '[.[] | select(.tag_name | startswith("d1-backup-"))][0].published_at // empty')

          if [ -z "$latest" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=no-backup" >> "$GITHUB_OUTPUT"
            echo "hours=0" >> "$GITHUB_OUTPUT"
            echo "latest=(none)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          now_ts=$(date -u +%s)
          backup_ts=$(date -u -d "$latest" +%s)
          hours=$(( (now_ts - backup_ts) / 3600 ))

          if [ "$hours" -gt "$THRESHOLD_HOURS" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=too-old" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "reason=fresh" >> "$GITHUB_OUTPUT"
          fi
          echo "hours=$hours" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Print result
        if: always()
        shell: bash
        run: |
          echo "stale:  ${{ steps.check.outputs.stale }}"
          echo "reason: ${{ steps.check.outputs.reason }}"
          echo "hours:  ${{ steps.check.outputs.hours }}"
          echo "latest: ${{ steps.check.outputs.latest }}"

      - name: Close alert if recovered
        if: steps.check.outputs.stale == 'false'
        shell: bash
        run: |
          set -euo pipefail
          nums=$(gh issue list --repo "$REPO" --label backup-health --state open --json number --jq '.[].number')
          if [ -z "$nums" ]; then
            echo "No open alerts."
            exit 0
          fi
          for n in $nums; do
            gh issue close "$n" --repo "$REPO" \
              --comment "Backup has recovered. Latest: ${{ steps.check.outputs.latest }}"
          done

      - name: Open alert if stale
        if: steps.check.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail

          gh label create backup-health \
            --repo "$REPO" \
            --color FBCA04 \
            --description "Automated backup alerts" \
            2>/dev/null || true

          existing=$(gh issue list --repo "$REPO" --label backup-health --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "Open alert already exists. Skipping."
            exit 0
          fi

          hours="${{ steps.check.outputs.hours }}"
          latest="${{ steps.check.outputs.latest }}"
          reason="${{ steps.check.outputs.reason }}"

          if [ "$reason" = "no-backup" ]; then
            title="[Backup] No D1 backup has ever been created"
          else
            title="[Backup] D1 backup is stale (${hours}h since ${latest})"
          fi

          gh issue create --repo "$REPO" \
            --title "$title" \
            --label backup-health \
            --body "Automated check: backup is stale or missing.

- Reason: ${reason}
- Latest backup: ${latest}
- Age: ${hours} hours (threshold: ${THRESHOLD_HOURS}h)

Manual recovery:
1. Go to https://github.com/${REPO}/actions/workflows/d1-backup-release.yml
2. Click 'Run workflow'
3. This issue will auto-close after next successful run"
