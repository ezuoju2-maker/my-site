name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static fallback
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Create isolated static build workspace
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT="${RUNNER_TEMP}/my-site-pages-build"
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"

          git archive --format=tar HEAD | tar -xf - -C "$BUILD_ROOT"

          rm -rf "$BUILD_ROOT/src/pages/api"
          rm -f "$BUILD_ROOT/src/middleware.ts"

          test -f "$BUILD_ROOT/package.json"
          test ! -d "$BUILD_ROOT/src/pages/api"
          test ! -f "$BUILD_ROOT/src/middleware.ts"

          echo "BUILD_ROOT=$BUILD_ROOT" >> "$GITHUB_ENV"

          echo "Static build workspace prepared."
          echo "Source repository remains untouched."

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/my-site-pages-build
        run: npm ci

      - name: Build static site
        working-directory: ${{ runner.temp }}/my-site-pages-build
        env:
          GITHUB_PAGES: "true"
          PUBLIC_API_BASE_URL: "https://xx-drp.pages.dev"
        run: npm run build

      - name: Verify static output
        shell: bash
        run: |
          set -euo pipefail

          test -d "$BUILD_ROOT/dist"
          test -f "$BUILD_ROOT/dist/index.html"

          if find "$BUILD_ROOT/dist/api" -type f -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Static build unexpectedly contains API files."
            exit 1
          fi

          echo "Static output validation: PASS"
          echo "Files: $(find "$BUILD_ROOT/dist" -type f | wc -l)"
          echo "Size: $(du -sh "$BUILD_ROOT/dist" | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/my-site-pages-build/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
