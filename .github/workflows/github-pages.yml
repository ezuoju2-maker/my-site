name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发部署冲突：同一时间只允许一个部署，但不等前一个
# 完整执行完（cancel-in-progress: false 表示不取消进行中的，排队）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove API routes for static GitHub Pages build
        run: |
          set -e
          rm -rf src/pages/api
          rm -rf src/middleware.ts
          echo "API routes and server middleware removed for static build."

      - name: Install, build, and upload site
        uses: withastro/action@v6
        env:
          GITHUB_PAGES: "true"
          PUBLIC_API_BASE_URL: "https://my-site-n7j.pages.dev"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
